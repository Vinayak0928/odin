# docker-compose.chroma.yml
# Standalone ChromaDB service for Odysseus RAG on localhost
# Usage:
#   docker compose -f docker-compose.chroma.yml up -d
#   docker compose -f docker-compose.chroma.yml logs -f
#   docker compose -f docker-compose.chroma.yml down

services:
  chromadb:
    image: docker.io/chromadb/chroma:latest
    container_name: odin-chromadb
    ports:
      - "${CHROMADB_BIND:-127.0.0.1}:8100:8000"
    volumes:
      - ${CHROMADB_DATA_DIR:-./data/chroma}:/chroma/chroma
    environment:
      - ANONYMIZED_TELEMETRY=FALSE
    restart: unless-stopped
